<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colin’s Food Court · Game prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Domine:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe1;--card:#fffaf0;--ink:#2e1c0b;--soft:#6d5638;--gold:#8a5a1c;--gold2:#c8963e;--line:rgba(138,90,28,.3);
  --ok:#2f5d3a;--okbg:#e4eee0;--bad:#a2442e;--badbg:#f6e2dc;--btn:#2e1c0b;--btnfg:#f6efe1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15110c;--card:#201a12;--ink:#f1e6d0;--soft:#bba98a;--gold:#d4af37;--gold2:#e4c470;--line:rgba(212,175,55,.3);
  --ok:#8fd19e;--okbg:#1f3020;--bad:#f0a08c;--badbg:#3a1f18;--btn:#d4af37;--btnfg:#15110c;}}
:root[data-theme="dark"]{--bg:#15110c;--card:#201a12;--ink:#f1e6d0;--soft:#bba98a;--gold:#d4af37;--gold2:#e4c470;--line:rgba(212,175,55,.3);
  --ok:#8fd19e;--okbg:#1f3020;--bad:#f0a08c;--badbg:#3a1f18;--btn:#d4af37;--btnfg:#15110c;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Domine,Georgia,serif;line-height:1.5;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:Cinzel,Georgia,serif;color:var(--gold);line-height:1.15;margin:0 0 10px}
h1{font-size:34px;font-weight:800}h2{font-size:23px;font-weight:800}h3{font-size:17px;font-weight:600}
p{margin:0 0 12px}
.eyebrow{font-family:Cinzel,Georgia,serif;font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.score{display:flex;justify-content:space-between;align-items:center;font-family:Cinzel,Georgia,serif;font-weight:600;font-size:13px;color:var(--soft);margin-bottom:12px}
.score b{color:var(--gold);font-size:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;min-height:110px}
.tile img,.host img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gold2)}
.badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);font-family:Cinzel,Georgia,serif;font-weight:800;font-size:10px;border:2px solid var(--gold2)}
.tile .t{font-family:Cinzel,Georgia,serif;font-weight:800;font-size:14px;line-height:1.2}
.tile .m{font-size:12px;color:var(--soft)}
.tile{position:relative}.tile.done::after{content:'✓';position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--card);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.host{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.host img{width:52px;height:52px}.host .badge{width:52px;height:52px}
.q{font-size:19px;font-weight:700;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{font:inherit;font-weight:700;font-size:16px;padding:15px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:center}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border:2px solid var(--ok);color:var(--ok)}
.opt.wrong{background:var(--badbg);border:2px solid var(--bad);color:var(--bad)}
.opt.picked{border:2px solid var(--gold)}
.btn{font-family:Cinzel,Georgia,serif;font-weight:800;font-size:16px;padding:14px 18px;border:0;border-radius:10px;background:var(--btn);color:var(--btnfg);cursor:pointer;width:100%;margin-top:14px}
.btn:disabled{opacity:.4;cursor:default}
.link{background:none;border:0;color:var(--soft);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:8px 0}
.ans{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.verdict{font-family:Cinzel,Georgia,serif;font-weight:800;font-size:18px;margin-bottom:4px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.stamp{display:inline-block;font-family:Cinzel,Georgia,serif;font-weight:600;font-size:11px;letter-spacing:.1em;border:2px solid currentColor;border-radius:4px;padding:2px 7px;margin-top:6px;color:var(--ok)}
.label{font-family:Georgia,serif;font-size:15px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.reveal-line{opacity:0;transition:opacity .5s}.reveal-line.in{opacity:1}
input[type=range]{width:100%;accent-color:var(--gold);height:36px}
.big{font-family:Cinzel,Georgia,serif;font-weight:800;font-size:40px;color:var(--gold);text-align:center;margin:4px 0}
.order{display:grid;gap:8px}
.chip{display:flex;gap:10px;align-items:center;font:inherit;font-size:15px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.chip .n{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:Cinzel,Georgia,serif;font-weight:800;font-size:13px}
.chip.set .n{background:var(--gold);border-color:var(--gold);color:var(--btnfg)}
.chip.right{border:2px solid var(--ok)}.chip.wrong{border:2px solid var(--bad)}
.note{font-size:13px;color:var(--soft)}
.tally{display:grid;gap:8px;margin-top:10px}
.tally .row{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--bad);width:0;transition:width .9s}
.hidden{display:none!important}
.slots{position:relative;display:grid;gap:8px;padding-left:16px;border-left:3px solid var(--gold);margin-left:6px}
.slot{position:relative;min-height:50px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--bg);cursor:pointer}
.slot::before{content:'';position:absolute;left:-25px;top:50%;width:13px;height:13px;border-radius:50%;background:var(--gold);transform:translateY(-50%)}
.slot.full{border-style:solid;border-color:var(--gold2)}
.slot.hov{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--bg))}
.slot.right{border:2px solid var(--ok);background:var(--okbg)}.slot.wrong{border:2px solid var(--bad);background:var(--badbg)}
.sn{font-family:Cinzel,Georgia,serif;font-weight:800;font-size:13px;color:var(--gold);min-width:20px}
.st{font-size:13px;color:var(--soft)}
.tlend{font-family:Cinzel,Georgia,serif;font-weight:600;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin:8px 0 6px 2px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px;min-height:40px}
.dchip{display:inline-block;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--gold);font-size:14px;line-height:1.3;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.dchip.in{flex:1;border:0;background:transparent;padding:4px 0}
.dchip.sel{outline:3px solid var(--gold);outline-offset:1px}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 8px 20px rgba(0,0,0,.25);background:var(--card);border:1px solid var(--gold);padding:10px 12px}
.trolley{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.titem{display:flex;gap:8px;align-items:center;text-align:left;font:inherit;font-size:14px;font-weight:700;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.titem .te{font-size:24px}
.titem.on{border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--bg))}
.titem.right{border:2px solid var(--ok);background:var(--okbg)}.titem.wrong{border:2px solid var(--bad);background:var(--badbg)}.titem.missed{border:2px dashed var(--bad)}
.fchart{display:grid;gap:14px;margin:14px 0 4px}
.fr{display:grid;grid-template-columns:118px 1fr 52px;gap:10px;align-items:center}
.fl{display:flex;gap:8px;align-items:center;font-size:14px;line-height:1.25}.fe{font-size:28px}
.fb{position:relative;height:26px;border-radius:6px;background:var(--line);overflow:visible}
.fb i{display:block;height:100%;width:0;border-radius:6px;background:var(--soft);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.fb i.fat{background:var(--gold)}
.fb .gm{position:absolute;top:-5px;width:3px;height:36px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
.fk{font-family:Cinzel,Georgia,serif;font-weight:800;font-size:14px;color:var(--gold);text-align:right}
.vis{display:flex;justify-content:center;align-items:center;gap:12px;font-size:52px;line-height:1;margin:6px 0 10px}
.pz{display:grid;gap:6px;margin:10px 0 2px;font-size:13px}.pz>div{display:grid;grid-template-columns:96px auto 1fr;gap:8px;align-items:center}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--ok);margin-right:3px}.dot.miss{background:transparent;border:2px dashed var(--bad);width:11px;height:11px}
.vis .vi{display:flex;flex-direction:column;align-items:center;gap:4px}.vis .vi small{font-family:Domine,Georgia,serif;font-size:12px;color:var(--soft)}
.vis .eq,.vis .qm{font-family:Cinzel,Georgia,serif;font-weight:800;font-size:38px;color:var(--gold)}
.ladder{display:flex;flex-direction:column-reverse;gap:4px;margin:0 0 12px}
.rung{display:flex;justify-content:space-between;padding:5px 10px;border-radius:6px;font-family:Cinzel,Georgia,serif;font-weight:600;font-size:13px;color:var(--soft);border:1px solid var(--line)}
.rung.now{background:var(--gold);color:var(--btnfg);border-color:var(--gold)}
.rung.won{color:var(--ok);border-color:var(--ok)}
.mopt{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;font-weight:700;font-size:15px;padding:13px 14px;border:1px solid var(--line);border-radius:28px;background:var(--bg);color:var(--ink);cursor:pointer}
.mopt .k{font-family:Cinzel,Georgia,serif;font-weight:800;color:var(--gold)}
.mopt.sel{background:#e9b949;color:#2e1c0b;border-color:#e9b949}.mopt.sel .k{color:#2e1c0b}
.mopt.right{background:var(--okbg);border:2px solid var(--ok);color:var(--ok)}
.mopt.wrong{background:var(--badbg);border:2px solid var(--bad);color:var(--bad)}
.mopt.gone{visibility:hidden}
.lifes{display:flex;gap:8px;margin:12px 0 0}
.life{flex:1;font:inherit;font-size:13px;font-weight:700;padding:9px;border:1px dashed var(--gold);border-radius:20px;background:transparent;color:var(--gold);cursor:pointer}
.life:disabled{opacity:.3;cursor:default;text-decoration:line-through}
.poll{display:grid;gap:5px;margin-top:10px}
.poll .row{display:grid;grid-template-columns:24px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.poll .bar i{background:var(--gold)}
</style>
</head>

 {id:'need',title:'Who Wants to Be a Centenarian?',host:'judge',mech:'Quiz show: who wants to live to 100?',type:'mill',
  intro:'Who wants to live to 100? Climb from 70 to 85 to 100 by answering three questions about what your body really needs. Pick an answer, confirm your final answer, and use your lifelines wisely.',
  qs:[
   {q:'Which gives your body the most complete, easily absorbed protein?',o:['Beans and lentils','Meat, fish and eggs','Bread and pasta','Fruit and vegetables'],a:1,prize:1,age:70,
    why:'Animal proteins score highest for completeness and digestibility (FAO protein quality scoring). Most plant proteins are short of at least one essential amino acid, though soya and well-combined plant foods come close.',st:'Consensus',
    table:[22,61,9,8]},
   {q:'Which of these must you get from food, because your body cannot make it?',o:['Carbohydrate','Certain fats','Sugar','Starch'],a:1,prize:2,age:85,
    why:'Your body can make all the glucose it needs from protein and fat, so there is no set minimum for dietary carbohydrate. But it cannot make certain fats, so those must come from food.',st:'Consensus',
    table:[48,34,10,8]},
   {q:'Which fats are essential: your body cannot make them, so you must eat them?',o:['Saturated fat and cholesterol','Omega-3 and omega-6','Trans fats','Olive oil’s monounsaturated fat'],a:1,prize:5,age:100,
    why:'The two essential fats are an omega-3 (alpha-linolenic acid) and an omega-6 (linoleic acid). The body makes its own saturated fat and cholesterol. The film’s argument is about the balance: modern diets carry far more omega-6 than omega-3.',st:'Consensus',
    table:[29,45,6,20]}]},
 {id:'protein',title:'Protein Power',host:'meat',mech:'Four-answer quiz',type:'mc',
  intro:'How much protein do you need, how much is in your food, and how much of it can your body actually use? Four questions.',
  qs:[
   {q:'For every kilo of body weight, how much protein do you need each day?',
    o:['0.5 g','0.8 g','1.5 g','2.5 g'],a:1,
    why:'About 0.8 g for every kilo, of good-quality protein your body can digest. The average woman weighs about 72 kg, so she is recommended to eat at least 58 g of protein a day. The average man weighs about 85 kg, so at least 68 g. These are minimums: many experts think adults over 65 need more, around 1 to 1.2 g per kilo, to hold on to muscle, and very active people more again. (Average weights: adults in England, 2021.)',st:'Consensus'},
   {q:'100 g of wholemeal bread has 9 g of protein. How much protein is in 100 g of cooked pork?',visual:'<span class="vi">🍞<small>9 g</small></span><span class="eq">vs</span><span class="vi">🥩<small>?</small></span>',
    o:['5 g','9 g','25 g','60 g'],a:2,
    why:'About 25 g: nearly three times as much as the same weight of bread.',st:'Consensus'},
   {q:'Your body can’t digest all of it. Of those 25 g and 9 g, how much can it actually use?',visual:'<span class="vi">🥩<small>25 g</small></span><span class="vi">🍞<small>9 g</small></span>',
    o:['Pork 24 g · Bread 8 g','All of it: 25 g · 9 g','Half: 12 g · 4 g','Pork 20 g · Bread 2 g'],a:0,
    why:'Meat is about 95% digestible and wholemeal wheat about 86 to 92%, because fibre and the plant’s tough cell walls get in the way (beans and lentils are lower again, about 70 to 85%). So 100 g gives you roughly 24 g of usable protein from pork and 8 g from bread. To reach the average man’s 68 g a day, that is about 280 g of pork, or about 850 g of wholemeal bread: well over a whole loaf.',st:'Consensus'},
   {q:'Your body builds protein from a set of nine essential amino acids, like a nine-piece puzzle. Which of these gives you the whole set on its own?',visual:'<span>🥩</span><span>🥣</span><span>🍚</span><span>🍞</span>',o:['Pork chop','Lentils','Rice','Bread'],a:0,
    why:'Meat, fish and eggs give you all nine in good amounts. Most plants are missing a piece. But two plants can complete each other: rice and lentils together make the full set. Soy is one of the few plants that comes close on its own.<div class="pz"><div><span>🥩 Pork chop</span><span><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></span><span>all 9</span></div><div><span>🥣 Lentils</span><span><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot miss"></i></span><span>short of methionine</span></div><div><span>🍚 Rice</span><span><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot miss"></i></span><span>short of lysine</span></div><div><span>🍞 Bread</span><span><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot miss"></i></span><span>short of lysine</span></div><div><span>🍚+🥣 Together</span><span><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></span><span>complete</span></div></div>',st:'Consensus'}]},
 {id:'fuel',title:'A Day of Fuel',host:'carbs',mech:'The Price is Right',type:'slider',
  intro:'An adult burns about 2,500 calories a day. If all of it came from one food, how much would you have to eat? Slide to your guess. Closest wins.',
  qs:[
   {q:'How many slices of bread would fuel you for a whole day?',min:1,max:40,a:31,unit:'slices',tol:[2,5,9],emo:'🍞',name:'Bread',show:'31 slices',kg:1.1,
    why:'At about 80 calories a slice, a loaf and a half.'},
   {q:'How much cooked rice would fuel you for a whole day?',min:100,max:2500,step:50,a:1900,unit:'grams',tol:[100,300,600],emo:'🍚',name:'Rice',show:'1.9 kg',kg:1.9,
    why:'At about 130 calories per 100 g, nearly 2 kg of cooked rice: around ten big bowls.'},
   {q:'How many apples would fuel you for a whole day?',min:1,max:30,a:26,unit:'apples',tol:[2,4,8],emo:'🍎',name:'Apples',show:'26 apples',kg:4.7,
    why:'At about 95 calories an apple, 26 apples. Fruit is mostly water and carries little energy for its size.'},
   {q:'And fatty meat? How much roast pork belly would fuel you for a whole day?',min:100,max:2500,step:50,a:500,unit:'grams',tol:[100,300,600],emo:'🥓',name:'Pork belly',show:'500 g',kg:0.5,fat:1,
    why:'Only about 500 g, at roughly 500 calories per 100 g. Fat carries more than twice the energy of carbohydrate per gram: 9 calories against 4. That is why the same day of fuel is 2 kg of rice but half a kilo of pork belly. (Figures approximate; pork belly varies a lot with how fatty the cut is.)',st:'Consensus'}]},
 {id:'omega',title:'The Omega-3 Hunt',host:'meat',mech:'Guess the amount',type:'mc',
  intro:'First: where in your body is omega-3 concentrated? Then: how much is really in the foods that are supposed to be good sources?',
  qs:[
   {q:'The light-sensing cells at the back of your eye are packed with fatty membranes. How much of that fat is omega-3?',visual:'<span class="vi">👁️<small>Eyes</small></span>',o:['About 5%','About 20%','Up to 60%'],a:2,
    why:'Up to 60%: the highest concentration of omega-3 anywhere in your body. The omega-3 here is DHA, which keeps these membranes flexible enough to capture light.',st:'Consensus'},
   {q:'Your brain is one of the fattiest organs in your body. How much of the fat in its grey matter is omega-3?',visual:'<span class="vi">🧠<small>Brain</small></span>',o:['About 2%','About 8%','About 18%'],a:2,
    why:'About 18%. DHA is one of the most common fats in the brain, concentrated where nerve cells connect.',st:'Consensus'},
   {q:'Your reproductive organs need omega-3 too. In men, the reproductive cells have to swim, and their tails are built from flexible fats. How much of that fat is omega-3?',visual:'<span class="vi">🧬<small>Reproductive cells</small></span>',o:['Under 1%','About 25%','About 75%'],a:1,
    why:'Roughly a quarter, though it varies between studies and people. Most of it sits in the tail, where the flexible DHA helps the cell swim. Low levels are linked to lower fertility. Share of all fats that are omega-3 (DHA), side by side:<div class="fchart"><div class="fr"><div class="fl"><span class="fe">👁️</span><span><strong>Eyes</strong><br><span class="note">light-sensing cells</span></span></div><div class="fb"><i class="fat" style="width:100%"></i></div><span class="fk">up to 60%</span></div><div class="fr"><div class="fl"><span class="fe">🧬</span><span><strong>Reproductive cells</strong><br><span class="note">in men</span></span></div><div class="fb"><i class="fat" style="width:42%"></i></div><span class="fk">about 25%</span></div><div class="fr"><div class="fl"><span class="fe">🧠</span><span><strong>Brain</strong><br><span class="note">grey matter</span></span></div><div class="fb"><i class="fat" style="width:30%"></i></div><span class="fk">about 18%</span></div><div class="fr"><div class="fl"><span class="fe">🩸</span><span><strong>Blood and heart</strong><br><span class="note">typical level</span></span></div><div class="fb"><i class="" style="width:9%"></i></div><span class="fk">about 5%</span></div></div>Most people’s blood and heart sit around 5%: far below the eyes, brain and reproductive cells, which hold on to it tightly.',st:'Consensus'},
   {q:'Europe’s food safety authority suggests adults get about 250 mg of omega-3 (EPA and DHA) a day. How much is in 100 g of cooked salmon?',visual:'<span class="vi">🐟<small>Salmon, 100 g</small></span>',o:['About 50 mg','About 500 mg','About 2,000 mg'],a:2,
    why:'About 2,000 mg for farmed salmon (wild is a little less, around 1,800 mg). One portion covers roughly eight days of the suggested amount.',st:'Consensus'},
   {q:'How much omega-3 is in 100 g of tinned sardines?',visual:'<span class="vi">🥫<small>Sardines, 100 g</small></span>',o:['About 100 mg','About 1,200 mg','About 5,000 mg'],a:1,
    why:'Roughly 1,000 to 1,400 mg. A cheap tin of sardines gives you about four days’ worth.',st:'Consensus'},
   {q:'How much omega-3 is in 100 g of tinned light tuna?',visual:'<span class="vi">🥫<small>Tuna, 100 g</small></span>',o:['About 30 mg','About 270 mg','About 1,500 mg'],a:1,

 {id:'verdict',title:'The Verdict',host:'all',mech:'Cluedo accusation',type:'verdict',

let pts=0,done={},app=document.getElementById('app');
try{const s=JSON.parse(localStorage.getItem('fc-proto')||'{}');pts=s.pts||0;done=s.done||{}}catch(e){}
function save(){try{localStorage.setItem('fc-proto',JSON.stringify({pts,done}))}catch(e){}}
function hostHTML(h){const x=HOST[h];return `<div class="host">${x.img?`<img src="${x.img}" alt="">`:`<div class="badge">${x.badge}</div>`}<div><div class="eyebrow">Your host</div><strong>${x.name}</strong></div></div>`}
function scoreBar(extra){return `${extra?`<button class="link" style="padding:0 0 10px" onclick="exitGame()">← All games</button>`:''}<div class="score"><span>${extra||'Colin’s Food Court'}</span><span>Jury points <b>${pts}</b></span></div>`}
function exitGame(){clearInterval(revT);menu()}
function el(h){app.innerHTML=h;window.scrollTo(0,0)}

function menu(){
  el(`${scoreBar()}
  <p class="eyebrow">Game prototype</p>
  <h1>Colin’s Food Court</h1>
  <p>Twelve games, played the way guests would on their phones. Tap any game to try it.</p>
  <p class="note">Prototype only: figures are approximate and still to be checked against the evidence table.</p>
  <div class="tiles">${GAMES.map((g,i)=>`<button class="tile${done[g.id]?' done':''}" onclick="start(${i})">
    ${HOST[g.host].img?`<img src="${HOST[g.host].img}" alt="">`:`<div class="badge">${HOST[g.host].badge}</div>`}
    <span class="t">${i+1}. ${g.title}</span><span class="m">${g.mech}${done[g.id]?' · played':''}</span></button>`).join('')}</div>
  <button class="link" onclick="pts=0;done={};save();menu()">Reset points</button>`);
}

let G,qi,gp;
function start(i){G=GAMES[i];G.guess=[];qi=0;gp=0;life={half:1,table:1};
  el(`${scoreBar('Game '+(i+1)+' of 12')}<div class="card">${hostHTML(G.host)}<p class="eyebrow">${G.mech}</p><h2>${G.title}</h2><p>${G.intro}</p>
  <button class="btn" onclick="next()">Play</button></div><button class="link" onclick="menu()">Back to all games</button>`)}
function finish(){pts+=gp;done[G.id]=1;save();
  el(`${scoreBar()}<div class="card">${hostHTML(G.host)}<h2>${G.title}: done</h2><p class="big">+${gp}</p><p style="text-align:center">jury points for this game</p>
  <button class="btn" onclick="menu()">Back to all games</button></div>`)}
function next(){
  if(G.type==='order')return order();
  if(G.type==='multi')return multi();
  if(G.type==='verdict')return verdict();
  if(qi>=G.qs.length)return G.id==='fuel'?fuelSummary():finish();
  if(G.type==='slider'||G.qs[qi].kind==='slider')return slider();
  if(G.type==='reveal')return reveal();
  if(G.type==='mill')return mill();
  return mc();
}
function answerBox(ok,why,st,label){return `<div class="ans"><div class="verdict ${ok?'ok':'no'}">${label||(ok?'Correct!':'Not quite.')}</div><p style="margin:0">${why}</p>${st?`<span class="stamp">${st.toUpperCase()}</span>`:''}</div>
  <button class="btn" onclick="qi++;next()">${qi+1>=G.qs.length?'Finish game':'Next'}</button>`}
function head(){return `${scoreBar(G.title+' · '+(qi+1)+' of '+G.qs.length)}<div class="card">${hostHTML(G.host)}`}

function mc(){const q=G.qs[qi];
  el(`${head()}${q.visual?`<div class="vis">${q.visual}</div>`:''}${q.label?`<div class="eyebrow">${q.q}</div><div class="label">${q.label}</div>`:`<div class="q">${q.q}</div>`}
  <div class="opts${q.o.length===2?' two':''}" id="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pickMC(${k})">${o}</button>`).join('')}</div><div id="res"></div></div>`)}
function pickMC(k){const q=G.qs[qi];const ok=k===q.a;if(ok)gp++;
  [...document.querySelectorAll('#opts .opt')].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
  document.getElementById('res').innerHTML=answerBox(ok,q.why,q.st)}

function slider(){const q=G.qs[qi];const mid=Math.round((q.min+q.max)/2);
  el(`${head()}<div class="q">${q.q}</div><div class="big" id="sv">${mid}</div>
  <input type="range" id="sl" min="${q.min}" max="${q.max}" step="${q.step||1}" value="${mid}" oninput="document.getElementById('sv').textContent=this.value">
  <button class="btn" id="lock" onclick="lockSlider()">Lock in our guess</button><div id="res"></div></div>`)}
function lockSlider(){const q=G.qs[qi];const v=+document.getElementById('sl').value;(G.guess=G.guess||[])[qi]=v;const diff=Math.abs(v-q.a);
  const t=q.tol||[2,6,12];const p=diff<=t[0]?3:diff<=t[1]?2:diff<=t[2]?1:0;gp+=p;document.getElementById('sl').disabled=true;document.getElementById('lock').classList.add('hidden');
  document.getElementById('res').innerHTML=answerBox(p>=2,`The answer is about <strong>${q.a} ${q.unit}</strong>. You were ${diff===0?'spot on':diff+' away'}. ${q.why}`,q.st||null,`+${p} point${p===1?'':'s'}`)}

let revT,revN;
function reveal(){const q=G.qs[qi];revN=1;
  el(`${head()}<div class="eyebrow">Ingredients</div><div class="label" id="lab">${q.lines.map((l,k)=>`<div class="reveal-line${k===0?' in':''}">${l}</div>`).join('')}</div>
  <p class="note" id="worth">Guess now for ${q.lines.length} points</p>
  <div class="opts" id="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pickRev(${k})">${o}</button>`).join('')}</div><div id="res"></div></div>`);
  clearInterval(revT);revT=setInterval(()=>{const ls=document.querySelectorAll('#lab .reveal-line');if(revN>=ls.length){clearInterval(revT);return}
    ls[revN].classList.add('in');revN++;const w=document.getElementById('worth');if(w)w.textContent='Guess now for '+(ls.length-revN+1)+' point'+(ls.length-revN+1===1?'':'s')},2200)}
function pickRev(k){clearInterval(revT);const q=G.qs[qi];const ok=k===q.a;const p=ok?Math.max(1,q.lines.length-revN+1):0;gp+=p;
  document.querySelectorAll('#lab .reveal-line').forEach(l=>l.classList.add('in'));
  [...document.querySelectorAll('#opts .opt')].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
  document.getElementById('worth').textContent='';
  document.getElementById('res').innerHTML=answerBox(ok,(ok?`+${p} points. `:'')+q.why,null)}

let placed,selChip=null,drag=null;
function order(){placed=Array(G.items.length).fill(null);selChip=null;
  G.pool=G.items.map((t,i)=>i).sort(()=>Math.random()-.5);renderOrder()}
function renderOrder(){
  const pool=G.pool.filter(i=>!placed.includes(i));
  const ends=G.ends||['First','Last'];
  el(`${scoreBar(G.title)}<div class="card">${hostHTML(G.host)}<p>${G.intro}</p>
  <p class="note">Drag each card onto the line, or tap a card and then tap a space.</p>
  <div class="tlend">${ends[0]}</div>
  <div class="slots" id="slots">${placed.map((it,k)=>`<div class="slot${it!==null?' full':''}" data-s="${k}"><span class="sn">${k+1}</span>${it!==null?`<span class="dchip in" data-i="${it}" data-from="${k}">${G.items[it]}</span>`:'<span class="st">Drop here</span>'}</div>`).join('')}</div>
  <div class="tlend">${ends[1]}</div>
  <div class="pool" id="pool">${pool.map(i=>`<span class="dchip${selChip===i?' sel':''}" data-i="${i}" data-from="pool">${G.items[i]}</span>`).join('')||'<span class="note">All placed. Check your order, or drag cards to swap them.</span>'}</div>
  <button class="link" onclick="order()">Start again</button>
  <button class="btn" id="chk" ${placed.includes(null)?'disabled':''} onclick="checkOrder()">Check our order</button><div id="res"></div></div>`);
  document.querySelectorAll('.dchip').forEach(c=>c.addEventListener('pointerdown',dragStart));
  document.querySelectorAll('.slot').forEach(sl=>sl.addEventListener('click',()=>{if(selChip===null)return;const k=+sl.dataset.s;putChip(selChip,'pool',k);selChip=null;renderOrder()}));
}
function putChip(i,from,k){const occ=placed[k];
  if(from!=='pool'){placed[+from]=null}
  placed[k]=i;
  if(occ!==null&&occ!==i){ if(from!=='pool')placed[+from]=occ; }
}
function slotAt(x,y){const e=document.elementFromPoint(x,y);return e?e.closest('.slot'):null}
function dragStart(ev){if(document.getElementById('chk').classList.contains('hidden'))return;
  const c=ev.currentTarget;ev.preventDefault();
  drag={i:+c.dataset.i,from:c.dataset.from,x0:ev.clientX,y0:ev.clientY,moved:false,ghost:null,src:c};
  window.addEventListener('pointermove',dragMove);window.addEventListener('pointerup',dragEnd,{once:true})}
function dragMove(ev){if(!drag)return;
  if(!drag.moved&&Math.hypot(ev.clientX-drag.x0,ev.clientY-drag.y0)>6){drag.moved=true;
    const g=drag.src.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);drag.ghost=g;drag.src.style.opacity='.35'}
  if(drag.ghost){drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px';
    document.querySelectorAll('.slot').forEach(s=>s.classList.remove('hov'));const sl=slotAt(ev.clientX,ev.clientY);if(sl)sl.classList.add('hov')}}
function dragEnd(ev){window.removeEventListener('pointermove',dragMove);const d=drag;drag=null;if(!d)return;
  if(d.ghost)d.ghost.remove();
  if(!d.moved){ // a tap
    if(d.from==='pool'){selChip=(selChip===d.i?null:d.i)}else{placed[+d.from]=null;selChip=null}
    return renderOrder()}
  const sl=slotAt(ev.clientX,ev.clientY);
  if(sl){putChip(d.i,d.from,+sl.dataset.s)}else if(d.from!=='pool'){placed[+d.from]=null}
  selChip=null;renderOrder()}
function checkOrder(){let p=0;
  document.querySelectorAll('#slots .slot').forEach(sl=>{const k=+sl.dataset.s;const ok=placed[k]===k;if(ok)p++;sl.classList.add(ok?'right':'wrong');
    if(!ok){const n=sl.querySelector('.sn');n.textContent=(k+1)+' ✗'}});
  document.querySelectorAll('.dchip').forEach(c=>c.style.cursor='default');
  gp=p;document.getElementById('chk').classList.add('hidden');
  document.getElementById('res').innerHTML=`<div class="ans"><div class="verdict ${p===G.items.length?'ok':'no'}">${p} of ${G.items.length} in the right place</div>
  <p style="margin:0"><strong>The right order:</strong></p><ol style="margin:6px 0 0;padding-left:22px">${G.items.map(t=>`<li>${t}</li>`).join('')}</ol><p style="margin:8px 0 0">${G.why}</p></div><button class="btn" onclick="finish()">Finish game</button>`}

let mSel;
function multi(){mSel=new Set();
  el(`${scoreBar(G.title)}<div class="card">${hostHTML(G.host)}<p>${G.intro}</p>
  <div class="trolley" id="tr">${G.items.map((x,k)=>`<button class="titem" data-k="${k}" onclick="mTog(this)"><span class="te">${x[0]}</span><span>${x[1]}</span></button>`).join('')}</div>
  <button class="btn" id="mchk" onclick="mCheck()">Check the trolley</button><div id="res"></div></div>`)}
function mTog(b){const k=+b.dataset.k;if(mSel.has(k))mSel.delete(k);else mSel.add(k);b.classList.toggle('on',mSel.has(k))}
function mCheck(){let hit=0,miss=0,wrong=0;
  document.querySelectorAll('#tr .titem').forEach(b=>{const k=+b.dataset.k;const has=G.items[k][2]===1;const sel=mSel.has(k);b.disabled=true;
    if(has&&sel){hit++;b.classList.add('right')}else if(has&&!sel){miss++;b.classList.add('missed')}else if(!has&&sel){wrong++;b.classList.add('wrong')}});
  const total=G.items.filter(x=>x[2]).length;gp=Math.max(0,hit-wrong);
  document.getElementById('mchk').classList.add('hidden');
  document.getElementById('res').innerHTML=`<div class="ans"><div class="verdict ${hit===total&&!wrong?'ok':'no'}">You found ${hit} of ${total} seed oils${wrong?`, with ${wrong} wrong tap${wrong>1?'s':''}`:''}</div>
  <p style="margin:0">${miss?`You missed ${miss}, marked with a dashed outline. `:''}${G.why}</p></div><button class="btn" onclick="finish()">Finish game</button>`}

function fuelSummary(){
  const max=Math.max(...G.qs.map(q=>q.kg));
  const rows=G.qs.map((q,i)=>{const g=G.guess[i];const gk=g!==undefined?(g*q.kg/q.a):null;
    return `<div class="fr"><div class="fl"><span class="fe">${q.emo}</span><span><strong>${q.name}</strong><br><span class="note">${q.show}</span></span></div>
      <div class="fb"><i class="${q.fat?'fat':''}" data-w="${q.kg/max*100}"></i>${gk!==null?`<b class="gm" style="left:${Math.min(100,gk/max*100)}%" title="Your guess"></b>`:''}</div>
      <span class="fk">${q.kg.toFixed(1)} kg</span></div>`}).join('');
  el(`${scoreBar('A Day of Fuel · the results')}<div class="card">${hostHTML(G.host)}<h2>One day of fuel, side by side</h2>
  <p class="note">The weight of each food you would eat to get 2,500 calories. The marker shows your guess.</p>
  <div class="fchart">${rows}</div>
  <div class="ans"><p style="margin:0">Fruit and starchy foods are heavy with water and carbohydrate. Fat carries more than twice the energy per gram, so the fatty meat is the lightest by far: about 500 g against nearly 5 kg of apples.</p></div>
  <button class="btn" onclick="finish()">Finish game</button></div>`);
  setTimeout(()=>document.querySelectorAll('.fb i').forEach(i=>i.style.width=i.dataset.w+'%'),60)}

let life={half:1,table:1},msel=null;
function mill(){const q=G.qs[qi];msel=null;
  const ladder=G.qs.map((x,i)=>`<div class="rung${i===qi?' now':i<qi?' won':''}"><span>Live to ${x.age}</span><span>${x.prize} jury point${x.prize===1?'':'s'}</span></div>`).join('');
  el(`${head()}<div class="ladder">${ladder}</div><div class="q">${q.q}</div>
  <div class="opts" id="mo">${q.o.map((o,k)=>`<button class="mopt" onclick="mPick(${k})"><span class="k">${'ABCD'[k]}:</span><span>${o}</span></button>`).join('')}</div>
  <div class="lifes" id="lf"><button class="life" ${life.half?'':'disabled'} onclick="mHalf()">50:50</button><button class="life" ${life.table?'':'disabled'} onclick="mTable()">Ask the table</button></div>
  <div id="pl"></div>
  <button class="btn hidden" id="fa" onclick="mFinal()">Final answer?</button><div id="res"></div></div>`)}
function mPick(k){msel=k;[...document.querySelectorAll('#mo .mopt')].forEach((b,j)=>b.classList.toggle('sel',j===k));document.getElementById('fa').classList.remove('hidden')}
function mHalf(){const q=G.qs[qi];life.half=0;const wrong=[0,1,2,3].filter(j=>j!==q.a).sort(()=>Math.random()-.5).slice(0,2);
  wrong.forEach(j=>{const b=document.querySelectorAll('#mo .mopt')[j];b.classList.add('gone');if(msel===j){msel=null;b.classList.remove('sel');document.getElementById('fa').classList.add('hidden')}});
  document.querySelectorAll('#lf .life')[0].disabled=true}
function mTable(){const q=G.qs[qi];life.table=0;document.querySelectorAll('#lf .life')[1].disabled=true;
  document.getElementById('pl').innerHTML=`<p class="note" style="margin:10px 0 0">How other tables answered (simulated):</p><div class="poll">${q.table.map((p,k)=>`<div class="row"><b>${'ABCD'[k]}</b><div class="bar"><i data-w="${p}"></i></div><span>${p}%</span></div>`).join('')}</div>`;
  setTimeout(()=>document.querySelectorAll('.poll i').forEach(i=>i.style.width=i.dataset.w+'%'),50)}
function mFinal(){if(msel===null)return;const q=G.qs[qi];document.getElementById('fa').classList.add('hidden');
  document.querySelectorAll('#mo .mopt,#lf .life').forEach(b=>b.disabled=true);
  setTimeout(()=>{const ok=msel===q.a;if(ok)gp+=q.prize;const bs=document.querySelectorAll('#mo .mopt');bs[q.a].classList.add('right');if(!ok)bs[msel].classList.add('wrong');
    document.getElementById('res').innerHTML=answerBox(ok,q.why,q.st,ok?(q.age===100?`Correct! You made it to 100. +${q.prize} points`:`Correct! You’ve reached ${q.age}. +${q.prize} point${q.prize===1?'':'s'}`):`Not quite. That one won’t get you to ${q.age}.`)},1400)}

let votes,sent;
function yrs(v){v=+v;return v>=25?'25+ years (life)':v===1?'1 year':v+' years'}
function verdict(){votes={};sent={};
  el(`${scoreBar('The Verdict')}<div class="card">${hostHTML('all')}<h2>The Verdict</h2><p>${G.intro}</p><p class="note">Find a suspect guilty and you also set the sentence.</p>
  ${G.sus.map(s=>`<div style="display:flex;gap:10px;align-items:center;margin:16px 0 8px"><img src="${IMG[s[0]]}" alt="" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--gold2)"><div><strong>${s[1]}</strong><div class="note">${s[2]}</div></div></div>
  <div class="opts two" data-s="${s[0]}">${['Guilty','Not guilty'].map((o,k)=>`<button class="opt" onclick="vote('${s[0]}',${k},this)">${o}</button>`).join('')}</div>
  <div class="hidden" id="sent-${s[0]}" style="margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span class="note">Sentence</span><strong id="sv-${s[0]}" style="font-family:Cinzel,Georgia,serif;color:var(--gold)">10 years</strong></div>
    <input type="range" min="1" max="25" value="10" aria-label="Sentence for ${s[1]} in years" oninput="sent['${s[0]}']=+this.value;document.getElementById('sv-${s[0]}').textContent=yrs(this.value)">
    <div style="display:flex;justify-content:space-between" class="note"><span>1 year</span><span>25+ (life)</span></div>
  </div>`).join('')}
  <button class="btn" id="vv" disabled onclick="showVerdict()">Deliver our verdict</button><div id="res"></div></div>`)}
function vote(s,k,b){votes[s]=k;[...b.parentNode.children].forEach(x=>x.classList.remove('picked'));b.classList.add('picked');
  const box=document.getElementById('sent-'+s);box.classList.toggle('hidden',k!==0);if(k===0&&sent[s]===undefined)sent[s]=10;
  document.getElementById('vv').disabled=Object.keys(votes).length<4}
function showVerdict(){document.getElementById('vv').classList.add('hidden');
  document.querySelectorAll('.card input[type=range]').forEach(r=>r.disabled=true);
  document.querySelectorAll('.opts.two .opt').forEach(b=>b.disabled=true);
  const rows=G.sus.map(s=>{const room=Math.round(25+Math.random()*60);const mine=votes[s[0]]===0;const pct=Math.min(100,Math.round(room*0.9+(mine?10:0)));
    const avg=Math.max(1,Math.min(25,Math.round(3+pct/100*18+(mine?(sent[s[0]]-10)/3:0))));
    const yours=mine?`You said: <strong>${yrs(sent[s[0]])}</strong>`:'You said: not guilty';
    return `<div style="margin-top:6px"><div class="row"><span>${s[1]}</span><div class="bar"><i data-w="${pct}"></i></div><span>${pct}%</span></div>
      <div class="note" style="margin:2px 0 0">${yours} · Room’s average sentence: <strong>${yrs(avg)}</strong></div></div>`}).join('');
  const guilty=G.sus.filter(s=>votes[s[0]]===0);
  const harsh=guilty.sort((x,y)=>sent[y[0]]-sent[x[0]])[0];
  document.getElementById('res').innerHTML=`<div class="ans"><div class="verdict ok">The room’s verdict</div><p class="note" style="margin:0 0 6px">Share of jurors voting guilty, and the sentences handed down (simulated room for this prototype).</p><div class="tally">${rows}</div>
  ${harsh?`<p style="margin:12px 0 0">Your harshest sentence: <strong>${harsh[1]}</strong>, ${yrs(sent[harsh[0]])}.</p>`:`<p style="margin:12px 0 0">You let every suspect walk free.</p>`}</div>
  <button class="btn" onclick="gp=2;finish()">Finish</button>`;
  setTimeout(()=>document.querySelectorAll('.tally i').forEach(i=>i.style.width=i.dataset.w+'%'),60)}


menu();
</script>
</body>
</html>
